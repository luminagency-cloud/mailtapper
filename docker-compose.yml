# mailtapper — mail bridge for AI agents. Pull-only: no worker, nothing is polled or stored.
# Production on the GCP VM also loads deploy/gcp/compose.gcp.yml (see README "Hosting & deployment").
services:
  api:
    build: .
    restart: unless-stopped
    environment:
      PORT: ${PORT:-3000}
      DATABASE_URL: ${DATABASE_URL}
      MAILTAPPER_KEK_B64: ${MAILTAPPER_KEK_B64}
      MAILTAPPER_LOCATOR_SECRET: ${MAILTAPPER_LOCATOR_SECRET}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-60}
      DEFAULT_TIER: ${DEFAULT_TIER:-pro}
      SMTP_DEFAULT_HOST: ${SMTP_DEFAULT_HOST:-smtp.stackmail.com}
      SMTP_DEFAULT_PORT: ${SMTP_DEFAULT_PORT:-587}
      SMTP_DEFAULT_TLS_MODE: ${SMTP_DEFAULT_TLS_MODE:-starttls}
    expose:
      - "3000"

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
    depends_on:
      - api

volumes:
  caddy_data: {}
